<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>山东科技大学 - 科大视听</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/layui/2.13.9/css/layui.css" rel="stylesheet">
</head>

<body style="height:100vh;width:100vw;">
    <div
        style="height:100%;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background-image: url('https://my.sdust.edu.cn/cas/assets/images/login_bgnew.jpg'); background-size:cover;">
        <div class="layui-card" style="box-shadow: 0 2px 4px rgba(0,0,0,.12), 0 0 6px rgba(0,0,0,.09);">
            <div class="layui-card-header" style="font-size:larger">登陆</div>
            <div class="layui-card-body">
                <div class="input-main"
                    style="display: flex;flex-direction: column;align-items: center;justify-content: center;">
                    <input type="text" placeholder="用户名" class="layui-input" style="width: 300px;margin-bottom: 10px;">
                    <div style="padding:5px;"></div>
                    <input type="password" placeholder="密码" class="layui-input"
                        style="width: 300px;margin-bottom: 10px;">
                    <div style="padding:5px;"></div>


                    <button type="button" class="layui-btn layui-bg-blue" onclick="window.alert('登陆成功')">登陆</button>


                </div>


            </div>
        </div>
    </div>



    <script src="https://cdnjs.cloudflare.com/ajax/libs/layui/2.13.9/layui.js"></script>


</body>

</html>
