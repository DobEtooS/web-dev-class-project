                    <p style="font-size:larger;">任丙忠，男，工学硕士，副教授，山东冠县人。现为山东科技大学软件工程系教师，主讲计算机网络、多媒体通信、信息安全技术、操作系统等课程。

主持和参与多项教育部、省级及校级科研教学项目，主编、参编多部教材。主要研究方向：网络与信息安全。</p>
