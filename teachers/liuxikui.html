                    <p style="font-size:larger;">刘西奎，男，汉族，1973年出生，山东泰安人，中共党员，工学博士，教授，博士生导师，北京大学博士后。现任山东科技大学济南校区管委副主任。曾任山东科技大学数学与系统科学院副院长、山东科技大学期刊社副社长，山东科技大学电气信息系主任兼党总支副书记。

主要研究方向：新型计算模型与系统、随机控制理论、组合最优化、机器学习。</p>
