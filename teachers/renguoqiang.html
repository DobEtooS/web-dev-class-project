                    <p style="font-size:larger;">任国强，男，山东莱州人，中共党员/九三学社，博士，副教授，硕士生导师，计算机软件系主任，济南校区侨驿站理事长，济南市云边协同智能技术研究重点实验室主任。

主要工作：主要承担数据结构、程序设计、算法设计与分析以及人工智能导论等课程授课工作；主持和参与多项科研与教改项目，发表SCI、EI及中文核心论文。

主要研究方向：图像识别、大数据集群系统、智能物联网系统。</p>
